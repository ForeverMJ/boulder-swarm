L0:
  id: G0
  title: 算法题组全解与经验沉淀 (TypeScript)
  frozen: true
  success_criteria: 6/6 problems bun test pass + trajectories + metrics + wiki落盘
L1:
  - id: M1
    title: 基础数组与字符串
    verifier: bun test src/problems/problem01.test.ts src/problems/problem02.test.ts
    done_when: M1内题目全部通过
  - id: M2
    title: 栈哈希与区间
    verifier: bun test src/problems/problem03.test.ts src/problems/problem04.test.ts
    done_when: M2内题目全部通过
  - id: M3
    title: 搜索与滑动窗口
    verifier: bun test src/problems/problem05.test.ts src/problems/problem06.test.ts
    done_when: M3内题目全部通过
  - id: M4
    title: 未见新题（真解题验证）
    verifier: bun test src/problems/problem07.test.ts src/problems/problem08.test.ts src/problems/problem09.test.ts
    done_when: agent从零写出通过解法并经合并门落盘
  - id: M5
    title: 3x3 matmul tensor rank（Laderman 23 开放 50 年，目标 22）
    verifier: bun src/matmul/goalCheck.ts
    done_when: rank<=22 的 exact scheme 经合并门落盘
  - id: M6
    title: 长驻 supervisor（无人值守连续运行一个月）
    verifier: bun test src/orchestrator/
    done_when: 持久状态+进程生命周期+轮次循环均有独立裁判测试并经合并门落盘
  - id: M7
    title: Erdős–Straus 4/n = 1/x+1/y+1/z 有限验证管线（用户明确任务，coordinator 注入）
    verifier: bun test src/es4/
    done_when: E1（n∈[2..10^4]）、E2（10^5）、E3（缩放引理+素数归约的 10^6）与 E4（突破表上限的 10^7 全覆盖）全部经合并门落盘
L2:
  - {id: T01, problem: src/problems/problem01.ts, tests: src/problems/problem01.test.ts, owner: worker, milestone: M1}
