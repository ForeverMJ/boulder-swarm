  - {id: R21, problem: src/matmul/attempts/VERIFY_ALL.json, tests: src/matmul/tools/verifyAll.test.ts, owner: orchestrator, milestone: M5, success: ALL-CLAIMS-REPRODUCE, note: one-command hub re-derives every campaign claim, exits non-zero on drift}
  - {id: V1, problem: src/matmul/verify/profileCount.ts, tests: src/matmul/verify/profileCount.test.ts, owner: worker, milestone: M5, note: independent re-derivation of the rank-22 profile count; the test is the judge and does not import the campaign implementation}
  - {id: V2, problem: src/matmul/verify/restrictionCeilingVerify.ts, tests: src/matmul/verify/restrictionCeilingVerify.test.ts, owner: worker, milestone: M5, note: independent re-derivation of rank(T|alpha) = n*rank(alpha) <= n^2, the claim that closed the single-covariant route}
  - {id: V3, problem: src/matmul/verify/reducibilityCriterion.ts, tests: src/matmul/verify/reducibilityCriterion.test.ts, owner: worker, milestone: M5, note: independent re-derivation of the m-matrix reducibility criterion that underwrites the R14 irreducibility verdicts, with two-sided known-answer fixtures}
  - {id: V4, problem: src/matmul/verify/blaserArithmetic.ts, tests: src/matmul/verify/blaserArithmetic.test.ts, owner: worker, milestone: M5, note: independent re-derivation of the published Blaser 2003 formula arithmetic and the load-bearing hypotheses}
  - {id: L1, problem: src/matmul/lit/zlarger.md, tests: src/matmul/verify/literatureProbe.test.ts, owner: worker, milestone: M5, note: obtain the missing definition of Z^v verbatim; the probe fails on any concession of failure, so a not-found result is reported as a failure rather than passing quietly}
  - {id: L2, problem: src/matmul/lit/zlarger2.md, tests: src/matmul/verify/literatureDiscipline.test.ts, owner: worker, milestone: M5, note: the three remaining Blaser ingredients (Z^v starred cells, verbatim "beta separates", Lemma 7) with VERBATIM and DERIVED sections kept apart; the publisher HTML MathJax is lossy for display matrices so the cells must come off a rendered page or PDF}
  - {id: R52, problem: src/matmul/tools/repairSearch.ts, tests: src/matmul/tools/repairSearch.test.ts, owner: worker, milestone: M5, note: "coordinated multi-triple repair of the single defect in T12c at tensor entry 7,4,7; no triple has v supported exactly at index 4 together with u supported exactly at index 7, so any activation carries collateral that must be cancelled, and a bounded null result must not be reported as an impossibility"}
  - {id: S1, problem: src/orchestrator/supervisorState.ts, tests: src/orchestrator/supervisorState.test.ts, owner: worker, milestone: M6, note: atomic durable round/budget journal with crash tolerance; loadState must never throw on a corrupt file and staleRounds must expose an interrupted round for requeue, which is the failure that lost the L1 result}
  - {id: S2, problem: src/orchestrator/agentLifecycle.ts, tests: src/orchestrator/agentLifecycle.test.ts, owner: worker, milestone: M6, note: salvage the worktree while the agent tree is still alive, then kill it, then report zero strays including grandchildren; encodes the round-41 timeout race and the seven orphaned processes}
  - {id: S3, problem: src/orchestrator/scoreAfterExit.ts, tests: src/orchestrator/scoreAfterExit.test.ts, owner: worker, milestone: M6, note: settle the worktree only after the agent tree exits, then score; record which paths a commit actually produced and treat an empty commit as not-a-success; ignore verdicts older than the commit that superseded them}
  - {id: S4, problem: src/orchestrator/roundLoop.ts, tests: src/orchestrator/roundLoop.test.ts, owner: worker, milestone: M6, note: the loop that calls S1-S3; requeue crash survivors, persist per round, stop on goal before budget, and halt on a repeated outcome instead of spinning for a month}
  - {id: D1, problem: src/recording/metrics.ts, tests: src/recording/metricsAppend.test.ts, owner: worker, milestone: M6, note: "saveResults must ACCUMULATE, not overwrite. It currently calls writeFile with only the current run's rows, so metrics/results.json holds exactly one run and replan, which reads that file, has a one-round-deep memory of what is solved. Already observed: a mock dispatch of S4 destroyed the R52 failure row, which was the only evidence that live dispatch produces nothing. Rows are append-only and replan's last-wins Map then gives correct latest-state semantics; the CSV must stay in step with the JSON"}
  - {id: D2, problem: src/orchestrator/runLoop.ts, tests: src/orchestrator/taskEvidence.test.ts, owner: worker, milestone: M6, note: "research tasks need an explicit completion-evidence field so replan can recognise them. R08, R14 and R19 point at goalCheck.ts, which exits 1 because rank-22 is unsolved, so they score passRate 0 forever and replan wants to redo finished work each round. Their success markers (CERTIFIED-LOCAL-OPTIMAL-2MOVE, ALL-IRREDUCIBLE, NO-OVERLAP-OBSERVED) are looked for in scoreboard output where they never appear, so the markers are dead. Add evidence?: string to the Task schema and thread it through loadTasks and both scoreAssignment call sites; when evidence names CAMPAIGN:<label>, a substantive row for that label in the worktree's CAMPAIGN.md scores 1, anything else scores 0 without throwing; tasks without evidence must score exactly as before. Then set evidence CAMPAIGN:R8 on R08, CAMPAIGN:R14 on R14 and CAMPAIGN:R19 on R19. Do NOT touch R10 (works through PAIRTABLES) or T12c (correctly pending through BEST22=none)."}
  - {id: E1, problem: src/es4/es4Search.ts, tests: src/es4/es4Search.test.ts, owner: worker, milestone: M7, note: "Erdos-Straus 4/n = 1/x+1/y+1/z finite verification, n in [2..10^4]; solved by live agent, gate landed (cb7b595)"}
  - {id: E2, problem: src/es4/verifyLarge.ts, tests: src/es4/verifyLarge.test.ts, owner: worker, milestone: M7, note: "N=10^5 within 10s judge budget (scaling lemma legal); stub red until agent lands; file-ownership src/es4/verifyLarge.ts only, imports from es4Search allowed"}
  - {id: E3, problem: src/es4/primeCover.ts, tests: src/es4/primeCover.test.ts, owner: worker, milestone: M7, note: "N=10^6 within 45s judge budget - scaling lemma + prime/residue reduction required; bounded null must stay honest via firstMissing; stub red until agent lands; file-ownership src/es4/primeCover.ts only"}
  - {id: E4, problem: src/es4/wideCover.ts, tests: src/es4/wideCover.test.ts, owner: worker, milestone: M7, note: "N=10^7 full coverage within 45s judge budget - lift the landed solver's hard table caps (sieve to 2*maxN derives from maxN); undecided n stay honestly uncovered; file-ownership src/es4/wideCover.ts only, imports from es4Search/verifyLarge/primeCover allowed"}
policy:
  workers: 12
  file_ownership: one-problem-per-worker
  merge: best-pass-rate-then-fewer-loc
  branch_prefix: agent/goal-
