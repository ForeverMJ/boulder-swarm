L0:
  id: G0
  title: 算法题组全解与经验沉淀 (TypeScript)
  frozen: true
  success_criteria: 6/6 problems bun test pass + trajectories + metrics + wiki落盘
L1:
  - id: M1
    title: 基础数组与字符串
    verifier: bun test src/problems/problem01.test.ts src/problems/problem02.test.ts
    done_when: M1内题目全部通过
  - id: M2
    title: 栈哈希与区间
    verifier: bun test src/problems/problem03.test.ts src/problems/problem04.test.ts
    done_when: M2内题目全部通过
  - id: M3
    title: 搜索与滑动窗口
    verifier: bun test src/problems/problem05.test.ts src/problems/problem06.test.ts
    done_when: M3内题目全部通过
  - id: M4
    title: 未见新题（真解题验证）
    verifier: bun test src/problems/problem07.test.ts src/problems/problem08.test.ts src/problems/problem09.test.ts
    done_when: agent从零写出通过解法并经合并门落盘
  - id: M5
    title: 3x3 matmul tensor rank（Laderman 23 开放 50 年，目标 22）
    verifier: bun src/matmul/scoreboard.ts
    done_when: rank<=22 的 exact scheme 经合并门落盘
L2:
  - {id: T01, problem: src/problems/problem01.ts, tests: src/problems/problem01.test.ts, owner: worker, milestone: M1}
  - {id: T02, problem: src/problems/problem02.ts, tests: src/problems/problem02.test.ts, owner: worker, milestone: M1}
  - {id: T03, problem: src/problems/problem03.ts, tests: src/problems/problem03.test.ts, owner: worker, milestone: M2}
  - {id: T04, problem: src/problems/problem04.ts, tests: src/problems/problem04.test.ts, owner: worker, milestone: M2}
  - {id: T05, problem: src/problems/problem05.ts, tests: src/problems/problem05.test.ts, owner: worker, milestone: M3}
  - {id: T06, problem: src/problems/problem06.ts, tests: src/problems/problem06.test.ts, owner: worker, milestone: M3}
  - {id: T07, problem: src/problems/problem07.ts, tests: src/problems/problem07.test.ts, owner: worker, milestone: M4}
  - {id: T08, problem: src/problems/problem08.ts, tests: src/problems/problem08.test.ts, owner: worker, milestone: M4}
  - {id: T09, problem: src/problems/problem09.ts, tests: src/problems/problem09.test.ts, owner: worker, milestone: M4}
  - {id: T10, problem: src/matmul/checker.ts, tests: src/matmul/checker.test.ts, owner: orchestrator, milestone: M5}
  - {id: T11, problem: src/matmul/attempts/T11.solution.ts, tests: src/matmul/scoreboard.ts, owner: worker, milestone: M5, success: BEST23}
  - {id: T12, problem: src/matmul/attempts/T12.solution.ts, tests: src/matmul/scoreboard.ts, owner: worker, milestone: M5, success: BEST22}
  - {id: T12b, problem: src/matmul/attempts/T12b.solution.ts, tests: src/matmul/scoreboard.ts, owner: worker, milestone: M5, success: BEST22}
  - {id: T12c, problem: src/matmul/attempts/T12c.solution.ts, tests: src/matmul/scoreboard.ts, owner: worker, milestone: M5, success: BEST22}
  - {id: T12d, problem: src/matmul/attempts/T12d.solution.ts, tests: src/matmul/scoreboard.ts, owner: worker, milestone: M5, success: BEST22}
policy:
  workers: 12
  file_ownership: one-problem-per-worker
  merge: best-pass-rate-then-fewer-loc
  branch_prefix: agent/goal-
