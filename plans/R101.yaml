label: R101
goal: "M8 AlphaTensor parity: autonomous from-zero exact 4x4x4 scheme at
  rank<=47 over F_2, verified by bun src/matmul/goalCheckA.ts"
rationale: "M8 gate is red (4 n=4 attempts, none exact rank<=47; goalCheckA
  classifies via integer-exact verify, so F_2-only hits never carry the gate).
  Measured frontier: exact rank-49 two-level Strassen floor is replayable
  (branch agent/goal-w0-A1@muse-r73 v2 checkpoint, R99 census); all 74
  replayable spark rank-47/48 supports exact-solved INCONSISTENT with 0
  consistent (R100-snapspark BOUNDED-NO-CLOSURE); drain/meld from exact-49
  anchors only ran 2 iters per start (R100-drain49 bounded red, best 49);
  fresh-seed ILS covered 6 seeds x 10s lanes (R100-seedils bounded red). Open
  remainder, sized before closing: (a) deep drain/meld from the 16 replayable
  exact-49 anchors at real iteration depth, (b) fresh-seed ILS on ground no lane
  has touched, (c) exact-solve of the remaining replayable R99-census 47/48
  supports outside the spark family, (d) the named structural gap-2 route
  (structured 2-term mergings of the 7 Strassen triples over F_2) never
  exhaustively enumerated. Four parallel file-owned lanes, each judgeable by its
  own colocated test; every rank-47 candidate exact-solved in-window per the
  composition rule, bounded nulls reported bounded."
budget:
  maxRounds: 4
stopConditions:
  - goalCheckA exits 0 with an exact n=4 rank<=47 scheme on main
  - all four lanes return bounded-red with no witness after spending their full
    budgets
  - any lane ships a witness scheme file verified by checker.verifyMod2 and
    goalSatisfiedA
tasks:
  - id: R101-drain
    problem: src/matmul/attempts/R101_drain49b.ts
    tests: src/matmul/attempts/R101_drain49b.test.ts
    milestone: M8
    timeoutMs: 1800000
    note: Deep deterministic drain/meld from the 16 replayable exact-49 F_2 anchors
      (sweepA 1e8db216 chain plus the 15 distinct snapped v2-floor supports
      enumerated in R100_drain49.ts); at least 50 iters per start with greedy
      exact F_2 drain, shear flips, split kicks and deterministic meld, seeded
      and deterministic; checkpoint full factor vectors plus stable fnv hashes
      to R101_drain49b.ndjson with resume-skip of hashes already checkpointed;
      verify any rank<=47 candidate via verifyMod2 plus goalSatisfiedA; export
      the replayed exact-49 anchor as scheme so the gate stays honestly red
      absent a witness; verdict BOUNDED-RED unless a witness lands;
      file-ownership attempts/R101_drain49b* only; no AlphaTensor tensors.
  - id: R101-ils
    problem: src/matmul/attempts/R101_seed_ils2.ts
    tests: src/matmul/attempts/R101_seed_ils2.test.ts
    milestone: M8
    timeoutMs: 1800000
    note: "From-zero iterated local search on fresh ground only: seeds exclude all
      previously run ILS seeds (22, 66, 7, 77, 107, 207, 307, 407); at least 6
      new seeds, at least 10s per lane; each lane calibrates against the
      exact-49 floor then runs ILS at fixed rank 47; EVERY rank<=47
      zero-mismatch candidate exact-solved on its fixed support in-window
      (composition rule, never leave a candidate unmatched); checkpoint vecs
      plus hashes for lane-best 47 and floor-best 49 states; verdict
      BOUNDED-NO-CLOSURE unless an exact state is solved and independently
      re-verified; file-ownership attempts/R101_seed_ils2* only; no AlphaTensor
      tensors."
  - id: R101-solve
    problem: src/matmul/attempts/R101_snap_solve.ts
    tests: src/matmul/attempts/R101_snap_solve.test.ts
    milestone: M8
    timeoutMs: 1800000
    note: "Exact-solve sweeper over the remaining replayable rank-47/48 supports in
      R99_snap_census.json that R100-snapspark did not retire (non-spark
      archives: orbit-fam 49s, storm rows with stored vectors, v3 meld
      split-open states with vectors); recover the gaussSolve per-axis
      machinery, solve every replayable support exactly over F_2; CONSISTENT
      ships an exact scheme file, INCONSISTENT retires the hash with axis and
      mismatch counts; checkpoint candidate hash, axis, consistency and mismatch
      counts to R101_snap_solve.ndjson; controls: floor seed solves CONSISTENT
      and one R100-retired hash re-derives INCONSISTENT; verdict SIZED-or-SWEPT
      with no closure claim unless a witness lands; file-ownership
      attempts/R101_snap_solve* only; no AlphaTensor tensors."
  - id: R101-merge2
    problem: src/matmul/attempts/R101_struct_merge.ts
    tests: src/matmul/attempts/R101_struct_merge.test.ts
    milestone: M8
    timeoutMs: 1800000
    note: "Structured gap-2 enumeration: enumerate structured 2-term mergings of the
      7 Strassen triples (left-ideal and octonion-style linear combos that stay
      rank-1 over F_2) against the replayable exact-49 skeleton; bounded
      enumeration with exact verifyMod2 plus goalSatisfiedA on every rank<=47
      candidate; checkpoint each best state as full 16-bit factor vectors with a
      stable hash to R101_struct_merge.ndjson; verdict BOUNDED-RED unless a
      witness lands; file-ownership attempts/R101_struct_merge* only; no
      AlphaTensor tensors."
