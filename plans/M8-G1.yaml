label: M8-G1
goal: Move M8 (exact 4x4x4 rank<=47 over F_2, verifier bun
  src/matmul/goalCheckA.ts) forward by locking the exact-49 baseline under a
  regression test, closing the structured 2-term-merge space over F_2 with its
  own judgeable completeness tests, running one bounded exact-coefficient-solve
  lane over not-yet-retired rank-47 candidate supports from merged artifacts
  (only this lane may claim BESTA47), and closing the round with an adjudication
  audit merging the round's own landed artifacts.
rationale: Since R87 every sweep lane (drain/snap/ILS/census, R100-R126) has
  produced rank-47 candidates carrying mismatch counts (best mm 12-16) but no
  candidate has ever snapped to exact, and sweep-only tasks scored 0/0 at the
  gate; the rounds that scored on main (R121) were the ones whose value was
  judgeable by colocated unit tests (10/10, 22/22). So this proposal (a) gives
  the two reusable assets left on branches/merged trees (exact-49 scheme,
  structured 2-term merge enumeration) their own NEW honest test files so they
  can score, (b) keeps the only goal-marker lane strictly bounded to supports
  named by artifacts already merged on main (R105_census.json,
  R100_snap_spark_best.json and the R100-R121 ledgers) so it cannot re-screen
  retired hashes, and (c) sequences the adjudication audit behind dependsOn
  instead of hoping artifacts land in time, per the timing rule. The +2 gap
  beyond two-level 49 is exactly the 2-term-merge structure the parity target
  implies (M8-A1-2 premise), so the merge space closure is the named remainder
  space most worth a bounded sweep now.
budget:
  maxRounds: 4
stopConditions:
  - goalCheckA exits 0 (exact rank<=47 scheme landed => BESTA47) — the
    milestone's own verifier, whenever any lane produces it.
  - All four tasks land through the merge gate and the audit task certifies the
    merge lane complete for this round, with all bounded nulls written to the
    certificate.
  - The exact-solve lane exhausts its listed candidate supports and records
    every CONSISTENT/INCONSISTENT outcome in M8G1_solve.json; a bounded null is
    an honest red for the goal marker but the task still scores via its own
    tests.
tasks:
  - id: M8-G1-baseline
    problem: src/matmul/attempts/M8G1_baseline_scheme.ts
    tests: src/matmul/attempts/M8G1_baseline.test.ts
    milestone: M8
    success: new colocated test passes asserting the recovered two-level Strassen
      scheme exports an exact rank-49 Scheme with verifyMod2 mismatches === 0
    note: Recover the exact-49 two-level scheme and search machine from the archived
      branches/merged trees (e.g. agent/goal-w0-A1@r45_c8e92f3 or the merged
      successor) verbatim without AlphaTensor imports, re-export it as
      M8G1_baseline_scheme.ts, and write a NEW test file asserting exactness
      (mismatches 0, rank 49). This is a floor guard, not a claim of progress to
      47. Judgeable entirely by its own tests.
  - id: M8-G1-merges
    problem: src/matmul/attempts/M8G1_merge_enum.ts
    tests: src/matmul/attempts/M8G1_merge_enum.test.ts
    milestone: M8
    success: new colocated test passes with a planted positive (a known rank-1
      2-term merge of two Strassen triples over F_2 is found by the enumerator)
      and an exact-space accounting that touches every candidate pair exactly
      once
    timeoutMs: 1800000
    note: "Enumerate the structured 2-term merging space: unordered pairs of the 7
      Strassen triple constructors, F_2-linear combos of factor vectors that
      stay rank-1 (verified by exact rank-1 test); write candidates to
      M8G1_merge_enum.ndjson with per-candidate verifyMod2 verdicts. The
      enumeration is bounded-null judged by its own tests (non-vacuity plant +
      each-pair-exactly-once invariant); it must NOT claim BESTA47. Distinct
      files from every other task."
  - id: M8-G1-solve
    problem: src/matmul/attempts/M8G1_exact_solve.ts
    tests: src/matmul/attempts/M8G1_exact_solve.test.ts
    milestone: M8
    success: exact F_2 Gaussian solve run over every not-yet-retired rank-47 support
      named in merged artifacts (R105_census.json, R100_snap_spark_best.json,
      prior solve ledgers); each outcome (CONSISTENT => verified scheme,
      INCONSISTENT => retired with axis and mismatch counts) recorded in
      M8G1_solve.json
    timeoutMs: 1800000
    note: "This is the ONLY task in this proposal allowed to attach the goal success
      marker BESTA47, because its normal outcome can be a real landing: a
      CONSISTENT exact solve on a rank-47 support both ships and verifies an
      exact scheme, making goalCheckA exit 0. If every support comes back
      INCONSISTENT, that is a bounded null: record it honestly, ship the ledger
      and the solver's own tests (including a planted round-trip solve that must
      pass), and leave goalCheckA red. Recover an existing merged exact
      solve/signature toolchain rather than reinventing it; no AlphaTensor
      tensors."
  - id: M8-G1-audit
    problem: src/matmul/attempts/M8G1_audit_merge.ts
    tests: src/matmul/attempts/M8G1_audit.test.ts
    milestone: M8
    success: new colocated test passes verifying M8G1_audit.json is internally
      consistent — merged ssh hash sets cross-check against
      M8G1_merge_enum.ndjson and M8G1_solve.json, retired hash sets stay
      disjoint from pending ones, and residual named supports are enumerated
      exactly
    timeoutMs: 1800000
    note: "Aggregate adjudication of the round's already-merged artifacts (it runs
      in a later layer via dependsOn). Write one certificate: merged hash sets,
      retired-with-reason set, pending hash set, and the exact count of
      unresolved supports, so the next round inherits a named remainder space
      instead of re-screening. Judgeable by its own self-consistency tests; must
      not claim BESTA47."
    dependsOn:
      - M8-G1-baseline
      - M8-G1-merges
      - M8-G1-solve
