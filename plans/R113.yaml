label: R113
goal: M8 AlphaTensor parity - exact rank<=47 over F_2 for 4x4x4 by closing the 4
  unprocessed rank-47 supports named in R112 plus fresh-seed lanes
rationale: R112 landed census plus snap plus ils7 plus drain49f on main but no
  witness - R112_census.json names exactly 4 UNPROCESSED replayable rank-47
  supports (fresh R111_seed_ils6 lane-best states with vecs, disjoint from all
  90 R107 hashes, all 6 R110 hashes, all 15 R109 snap verdicts and all 6 R111
  snap verdicts, never exact-solved). R109 snap retired 15 supports and R111
  snap retired 6, so the exact-solve sweeper is the proven closer - the named
  remainder is these 4 hashes. R112-ils7 ran 6 fresh seeds to the exact-49 floor
  with unmatched 0 and no witness, so ILS ground is not exhausted but needs new
  seeds. Exact-49 floor stands via two-level Strassen plus orbit anchors. No
  merge task in this round - R113 outputs do not exist yet and a merge whose
  inputs do not exist always fails, so adjudication belongs to R114.
budget:
  maxRounds: 3
stopConditions:
  - "exact-47 scheme verified by verifyMod2 plus goalSatisfiedA: close as
    WITNESS"
  - "all 4 R112 supports exact-solved with zero survivors and no fresh rank-47
    candidate from drain or ILS: close as BOUNDED-NO-WITNESS"
  - "budget exhausted with unsolved supports remaining: report coverage
    honestly, claim nothing closed"
tasks:
  - id: R113-size
    problem: src/matmul/attempts/R113_census.ts
    tests: src/matmul/attempts/R113_census.test.ts
    milestone: M8
    timeoutMs: 1800000
    note: "Census, not closure (R112 SIZED pattern): re-derive the residual on
      CURRENT main files - enumerate every replayable rank-47/48 support across
      R112_census.json, R112_snap_solve.ndjson verdicts, R112_seed_ils7.ndjson
      lane-bests and R112_drain49f checkpoints, marking each hash RETIRED versus
      LIVE versus UNPROCESSED with resume of the 4 named R112 hashes; emit
      R113_census.json with per-candidate hash, rank, mismatches, vecs-present
      and archive plus exact-solve workload pricing; verdict SIZED-NO-CLOSURE;
      file-ownership attempts/R113_census.ts plus .test.ts plus .json only;
      field F_2 throughout; no AlphaTensor tensors."
  - id: R113-snap
    problem: src/matmul/attempts/R113_snap_solve.ts
    tests: src/matmul/attempts/R113_snap_solve.test.ts
    milestone: M8
    timeoutMs: 1800000
    note: Exact-solve sweeper over the 4 UNPROCESSED rank-47 supports named in
      R112_census.json on main (fresh R111_seed_ils6 lane-best, 47 vecs each),
      skipping any hash already retired by R112_snap_solve.ndjson verdicts on
      main via resume-skip. Recover gaussSolve per-axis machinery without
      importing AlphaTensor tensors. CONSISTENT ships an exact scheme file
      verified by verifyMod2, INCONSISTENT retires the hash with axis and
      mismatch counts. Checkpoint hash plus axis plus consistency plus mismatch
      counts to R113_snap_solve.ndjson. Controls - floor seed solves CONSISTENT,
      one R100-retired spark hash re-derives INCONSISTENT. Bounded nulls stay
      bounded, never impossibility. File-ownership attempts/R113_snap_solve plus
      ndjson only.
  - id: R113-drain
    problem: src/matmul/attempts/R113_drain49g.ts
    tests: src/matmul/attempts/R113_drain49g.test.ts
    milestone: M8
    timeoutMs: 1800000
    note: Deterministic drain plus meld from fresh exact-49 orbit anchors only,
      regenerated by the R105-R112 product-family construction with a disjoint
      enumeration offset so no R105/R106/R107/R109/R112 support repeats. Fresh
      seeds outside all previously run ILS seeds. At least 50 seeded iters per
      start with greedy exact F_2 drain plus shear flips plus split kicks plus
      deterministic meld. Checkpoint full factor vectors plus stable fnv hashes
      to R113_drain49g.ndjson with resume-skip of hashes already checkpointed in
      R100 plus R101 plus R106 plus R107 plus R109 plus R111 plus R112 ndjson
      files. Every rank-47 candidate exact-solved in-window, verified by
      verifyMod2 plus goalSatisfiedA. File-ownership attempts/R113_drain49g plus
      ndjson only; no AlphaTensor tensors.
  - id: R113-ils
    problem: src/matmul/attempts/R113_seed_ils8.ts
    tests: src/matmul/attempts/R113_seed_ils8.test.ts
    milestone: M8
    timeoutMs: 1800000
    note: From-zero iterated local search on fresh ground only, seeds exclude every
      previously run ILS seed (22, 66, 7, 77, 107, 207, 307, 407, plus all
      R106/R107/R109/R111/R112 lane seeds recorded in their ndjson lane fields).
      At least 6 new seeds with at least 10s per lane, each lane calibrates
      against the exact-49 floor then runs ILS at fixed rank 47. Every rank-47
      zero-mismatch candidate exact-solved on its fixed support in-window, never
      left unmatched. Checkpoint vecs plus hashes for lane-best 47 and
      floor-best 49 states to R113_seed_ils8.ndjson. Verdict BOUNDED-NO-CLOSURE
      unless an exact state is solved and independently re-verified.
      File-ownership attempts/R113_seed_ils8 plus ndjson only; no AlphaTensor
      tensors.
