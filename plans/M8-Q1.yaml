label: M8-Q1
goal: Enumerate all structured 2-term mergings of the 7 Strassen triples
  (F₂-linear and sign-bearing integer linear combos that stay rank-1 over F₂) to
  find a 47-term decomposition, reducing the 49-term two-level Strassen floor
rationale: The current best landed scheme over F₂ has exact rank 49
  (AlphaTensor's Nature 2022 record). The two-level Strassen structure uses 7
  Strassen triples; merging 2 of them via F₂-preserving linear combinations
  could reduce the term count to 47. This task systematically enumerates the
  mergeable-pair space, providing a deterministic negative result or a verified
  witness.
budget:
