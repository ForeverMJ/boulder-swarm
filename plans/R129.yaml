label: R129
goal: "M8: 4x4 matmul exact rank<=47 over F_2 (AlphaTensor parity, Nature 2022).
  Current: exact rank-49 two-level Strassen floor. Gap: 2 terms."
rationale: R126 (latest merged) ran ILS on fresh seeds. R127/R128 proposed but
  not yet on main. R129 continues the census-snap-drain-ils cycle on fresh
  ground, building on all merged artifacts. The 49->47 gap requires either a
  structured 2-term merge of Strassen triples or a fresh search lane.
budget:
  maxRounds: 4
stopConditions:
  - goalCheckA exits 0 (BESTA47 witness found and verified)
  - All replayable rank-47/48 supports exact-solved and retired INCONSISTENT
  - Fresh census finds zero unprocessed supports with vecs present
tasks:
  - id: R129-census
    problem: src/matmul/attempts/R129_census.ts
    tests: src/matmul/attempts/R129_census.test.ts
    milestone: M8
    timeoutMs: 1800000
    note: "Census, not closure: enumerate every replayable rank-47/48 support across
      all merged census/snap/ils/drain artifacts on main (R99-R126), marking
      each hash RETIRED versus LIVE versus UNPROCESSED with vecs-present and
      archive pin; emit R129_census.json with exact-solve workload pricing;
      verdict SIZED-NO-CLOSURE; field F_2 throughout; no AlphaTensor tensors."
  - id: R129-snap
    problem: src/matmul/attempts/R129_snap_solve.ts
    tests: src/matmul/attempts/R129_snap_solve.test.ts
    milestone: M8
    timeoutMs: 1800000
    note: "Exact-solve sweeper over the UNPROCESSED replayable rank-47/48 supports
      in R129_census.json on main only: skip every hash retired by a merged snap
      ndjson; recover the gaussSolve per-axis F_2 machinery from landed
      R126_seed_ils16.ts on main without importing AlphaTensor tensors;
      CONSISTENT ships an exact scheme file verified by verifyMod2, INCONSISTENT
      retires the hash with axis and mismatch counts; checkpoint hash plus axis
      plus consistency plus mismatch counts to R129_snap_solve.ndjson; controls:
      floor seed solves CONSISTENT and one retired hash re-derives INCONSISTENT;
      bounded nulls stay bounded; file-ownership attempts/R129_snap_solve* only;
      run heavy sweeps under nice -n 19."
  - id: R129-drain
    problem: src/matmul/attempts/R129_drain49q.ts
    tests: src/matmul/attempts/R129_drain49q.test.ts
    milestone: M8
    timeoutMs: 1800000
    note: "Deterministic drain plus meld from fresh exact-49 anchors only: anchors
      not yet drained in any merged R*_drain49* ndjson on main, fresh
      enumeration offset so no earlier support repeats; fresh seeds outside all
      previously run ILS seeds; at least 50 seeded iters per start with greedy
      exact F_2 drain plus shear flips plus split kicks plus deterministic meld;
      checkpoint full factor vectors plus stable fnv hashes to
      R129_drain49q.ndjson with resume-skip of already-checkpointed hashes;
      every rank<=47 candidate exact-solved in-window and verified by verifyMod2
      plus goalSatisfiedA; verdict BOUNDED-RED unless a witness lands;
      file-ownership attempts/R129_drain49q* only; no AlphaTensor tensors; run
      under nice -n 19."
  - id: R129-ils
    problem: src/matmul/attempts/R129_seed_ils17.ts
    tests: src/matmul/attempts/R129_seed_ils17.test.ts
    milestone: M8
    timeoutMs: 1800000
    note: "From-zero iterated local search on fresh ground only: seeds exclude every
      seed recorded in any merged R*_seed_ils*.ndjson or R*_walk_ils.json on
      main (including 22, 66, 7, 77, 107, 207, 307, 407 and all R101-R126 lane
      seeds); at least 6 new seeds with at least 10s per lane, each lane
      calibrates against the exact-49 floor then runs ILS at fixed rank 47;
      every rank<=47 zero-mismatch candidate exact-solved on its fixed support
      in-window, never left unmatched; checkpoint vecs plus hashes for lane-best
      47 and floor-best 49 states to R129_seed_ils17.ndjson; verdict
      BOUNDED-NO-CLOSURE unless an exact state is solved and independently
      re-verified; file-ownership attempts/R129_seed_ils17* only; no AlphaTensor
      tensors."
