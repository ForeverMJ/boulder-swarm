label: R103
goal: "M8: exact 4x4x4 rank<=47 over F_2 (AlphaTensor parity)"
rationale: >
  100+ rounds of A1 search have landed exact-49 (two-level Strassen) but not 47.
  The gap is 2 terms. The campaign's own analysis identifies the decisive move:
  exact F_2 coefficient solving on rank-47 candidate supports. R100 merged three
  fresh search lanes (snap_spark, seed_ils, drain49) whose NDJSON stores
  candidate metrics but not full factor tensors. This proposal decomposes the
  remaining search into four independent lanes, each targeting the 49->47 gap
  with a different strategy, all scoring against the same gate.
budget:
  maxRounds: 4
stopConditions:
  - An exact rank<=47 F_2 scheme passes goalCheckA (exit 0)
  - All four lanes report bounded null with named refutation families
  - R103-1 exact solver is verified on known-answer fixtures
tasks:
