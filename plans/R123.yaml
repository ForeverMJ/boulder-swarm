label: R123
goal: "M8 parity: close the named R116/R119-R121 remainder on current main -
  exact-solve every replayable rank-47 support, drain fresh exact-49 anchors,
  and run fresh-seed ILS, all over F_2 with no AlphaTensor imports"
rationale: "Frontier is still exact-49 with BESTA47 absent and goalCheckA
  exiting 1. The R122 round scored 0/0 on all four tasks and nothing has merged
  since R107, so the R119-R121 residual was never sized on main.
  R116_census.json on main still names UNPROCESSED seedils8 rank-47 supports
  that R120-snapA/B targeted with a BESTA47 marker but never landed. Per the
  scoring rule, bounded sweeps must not carry the goal-level marker, so this
  round re-proposes the same remainder without success markers, judged by
  colocated tests only. Size-then-close: a census re-derives the residual on
  current main files first, while snap, drain, and ILS close disjoint lanes
  against already-merged inputs only. No merge task here - adjudication belongs
  to a later round."
budget:
  maxRounds: 3
stopConditions:
  - "witness: an exact rank<=47 scheme over F_2 verified by verifyMod2 plus the
    goalCheckA gate path"
  - "snap verdicts: every UNPROCESSED support named from landed inputs is
    CONSISTENT-shipped or INCONSISTENT-retired with zero unmatched rank<=47
    candidates"
  - "bounded null: no witness and the residual is named as bounded-red with
    per-hash coverage, never as impossibility"
  - "budget exhausted: report SIZED-NO-CLOSURE or BOUNDED-NO-CLOSURE honestly
    with checkpoints on disk"
tasks:
  - id: R123-census
    problem: src/matmul/attempts/R123_census.ts
    tests: src/matmul/attempts/R123_census.test.ts
    milestone: M8
    timeoutMs: 1800000
    note: "Census, not closure (R116 SIZED-NO-CLOSURE pattern): re-derive the
      residual on CURRENT main files - enumerate every replayable rank-47/48
      support across the landed R105/R106/R107/R110/R112/R113/R116 census json
      files plus the merged R109/R111/R112/R113/R117/R118 snap/ils/drain ndjson
      verdicts, marking each hash RETIRED versus LIVE versus UNPROCESSED with
      vecs-present, archive pin, and exact-solve workload pricing; emit
      R123_census.json; verdict SIZED-NO-CLOSURE; file-ownership
      attempts/R123_census.* only; field F_2 throughout; no AlphaTensor tensors;
      run under nice -n 19."
  - id: R123-snap
    problem: src/matmul/attempts/R123_snap_solve.ts
    tests: src/matmul/attempts/R123_snap_solve.test.ts
    milestone: M8
    timeoutMs: 1800000
    note: "Exact-solve sweeper over the UNPROCESSED replayable rank-47 supports
      named in the landed R116_census.json on main only (skip every hash retired
      by a merged snap ndjson on main: R111_snap_solve, R112_snap_solve,
      R113_snap_solve, R117_snap_solve, R118_snap_solve2, and every
      R100/R101-retired spark hash); recover the gaussSolve per-axis machinery
      without importing AlphaTensor tensors; CONSISTENT ships an exact scheme
      file verified by verifyMod2, INCONSISTENT retires the hash with axis and
      mismatch counts; checkpoint hash plus axis plus consistency plus mismatch
      counts to R123_snap_solve.ndjson; controls: floor seed solves CONSISTENT
      and one retired hash re-derives INCONSISTENT; bounded nulls stay bounded,
      never impossibility; file-ownership attempts/R123_snap_solve* plus
      optional attempts/R123_scheme_*.ts only; run exact-solve sweeps under nice
      -n 19."
  - id: R123-drain
    problem: src/matmul/attempts/R123_drain49m.ts
    tests: src/matmul/attempts/R123_drain49m.test.ts
    milestone: M8
    timeoutMs: 1800000
    note: "Deterministic drain plus meld from fresh exact-49 anchors only:
      regenerated by the R105-R118 product-family construction with a disjoint
      enumeration offset so no earlier support repeats, with resume-skip of
      hashes already checkpointed in any merged
      R100/R101/R104/R105/R106/R107/R112/R113/R116/R117/R118 drain ndjson on
      main; at least 50 seeded deterministic iters per start with greedy exact
      F_2 drain plus shear flips plus split kicks plus deterministic meld;
      checkpoint full factor vectors plus stable fnv hashes to
      R123_drain49m.ndjson; every rank<=47 candidate exact-solved in-window and
      verified by verifyMod2 plus goalSatisfiedA; verdict BOUNDED-RED absent a
      witness; file-ownership attempts/R123_drain49m* only; no AlphaTensor
      tensors; run under nice -n 19."
  - id: R123-ils
    problem: src/matmul/attempts/R123_seed_ils13.ts
    tests: src/matmul/attempts/R123_seed_ils13.test.ts
    milestone: M8
    timeoutMs: 1800000
    note: "From-zero iterated local search on fresh ground only: seeds exclude every
      seed recorded in any merged R*_seed_ils*.ndjson or R*_walk_ils.json on
      main (including 22, 66, 7, 77, 107, 207, 307, 407 and all
      R101/R106/R107/R108/R111/R112/R113/R116/R117/R118 lane seeds); at least 6
      new seeds with at least 10s per lane, each lane calibrates against the
      exact-49 floor then runs ILS at fixed rank 47; every rank<=47
      zero-mismatch candidate exact-solved on its fixed support in-window, never
      left unmatched; checkpoint vecs plus hashes for lane-best 47 and
      floor-best 49 states to R123_seed_ils13.ndjson; verdict BOUNDED-NO-CLOSURE
      unless an exact state is solved and independently re-verified;
      file-ownership attempts/R123_seed_ils13* only; no AlphaTensor tensors; run
      under nice -n 19."
