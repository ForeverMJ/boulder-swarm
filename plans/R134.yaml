label: R134
goal: "M8: exact 4x4x4 matrix multiplication scheme with rank <= 47 over F_2,
  constructed from scratch without importing AlphaTensor's published tensors
  (AlphaTensor parity, Nature 610, 2022)"
rationale: "The exact-49 two-level Strassen floor stands and goalCheckA exits 1;
  BESTA47 is absent. R124_census.json on main names the residual exactly: 18
  LIVE rank-47 supports (6 R116_seed_ils8 + 6 R117_seed_ils9 + 6 R118_seed_ils10
  lane-bests, 47 vecs each, never exact-solved) on top of 124 RETIRED
  INCONSISTENT hashes. R125 snapA/B retired the 12 UNPROCESSED with 0
  consistent. R126 ils16 ran on fresh seeds but its lane-best checkpoint is not
  on main, so its contribution is unpriced. This round closes the named
  18-support remainder (census then exact-snap), keeps the fresh-seed ILS
  pipeline flowing, and adjudicates with a merge that writes the CAMPAIGN:R134
  row. Every task is judged by its own colocated test or CAMPAIGN evidence; no
  goal-level BESTA47 marker is attached to any task whose normal outcome is a
  bounded null."
budget:
  maxRounds: 4
stopConditions:
  - "goalCheckA exits 0: an exact rank<=47 scheme over F_2 is verified and lands
    on main"
  - all LIVE and UNPROCESSED rank-47 supports from R134_census.json are
    exact-solved and retired INCONSISTENT with 0 consistent, leaving an empty
    residual
  - round budget exhausted with honest bounded verdicts (SIZED-NO-CLOSURE /
    BOUNDED-NO-CLOSURE / BOUNDED-RED) and no false closure claim
tasks:
  - id: R134-census
    problem: src/matmul/attempts/R134_census.ts
    tests: src/matmul/attempts/R134_census.test.ts
    milestone: M8
    timeoutMs: 1800000
    note: "Census, not closure (R124 SIZED-NO-CLOSURE pattern): re-derive the
      residual on CURRENT main files - enumerate every replayable rank-47/48
      support with vecs present across R124_census.json, R125_snap_solveA.ndjson
      and R125_snap_solveB.ndjson verdicts, and the R126_seed_ils16 lane-best
      checkpoint if present on main (if the R126 ndjson is absent, record it as
      missing and price the gap honestly, never assume it); dedupe by stable fnv
      hash; mark each hash RETIRED versus LIVE versus UNPROCESSED; emit
      R134_census.json with per-candidate hash, rank, mismatches, vecs-present,
      archive pin and exact-solve workload pricing; verdict SIZED-NO-CLOSURE;
      field F_2 throughout; no AlphaTensor tensors; file-ownership
      attempts/R134_census.ts plus .test.ts plus .json only."
  - id: R134-ils
    problem: src/matmul/attempts/R134_seed_ils17.ts
    tests: src/matmul/attempts/R134_seed_ils17.test.ts
    milestone: M8
    timeoutMs: 1800000
    note: "From-zero iterated local search on fresh ground only: seeds exclude every
      previously run ILS seed (22, 66, 7, 77, 107, 207, 307, 407 and every seed
      recorded in R106_walk_ils.json, R107_seed_ils3, R108_seed_ils4,
      R109_seed_ils5, R111_seed_ils6, R112_seed_ils7, R113_seed_ils8,
      R116_seed_ils8, R117_seed_ils9, R118_seed_ils10, R121_seed_ils,
      R123_seed_ils13, R124_seed_ils14, R125_seed_ils15 and R126_seed_ils16
      ndjson lane fields present on main); at least 6 new seeds with at least
      10s per lane; each lane calibrates against the exact-49 floor then runs
      ILS at fixed rank 47; EVERY rank<=47 zero-mismatch candidate exact-solved
      on its fixed support in-window with hash, axis, consistency and mismatch
      counts checkpointed to R134_seed_ils17.ndjson; verdict BOUNDED-NO-CLOSURE
      unless an exact state is solved and independently re-verified;
      file-ownership attempts/R134_seed_ils17* only; no AlphaTensor tensors; run
      heavy solves under nice -n 19."
  - id: R134-snap
    problem: src/matmul/attempts/R134_snap_solve.ts
    tests: src/matmul/attempts/R134_snap_solve.test.ts
    milestone: M8
    timeoutMs: 1800000
    note: Exact-solve sweeper over the LIVE and UNPROCESSED replayable rank-47
      supports named in R134_census.json (the 18 LIVE R116/R117/R118 lane-bests
      plus any UNPROCESSED the census finds); recover the gaussSolve per-axis
      F_2 machinery from landed R125_snap_solveA.ts on main without importing
      AlphaTensor tensors; CONSISTENT ships an exact scheme file verified by
      verifyMod2 plus goalSatisfiedA, INCONSISTENT retires the hash with axis
      and mismatch counts; checkpoint hash plus axis plus consistency plus
      mismatch counts to R134_snap_solve.ndjson; controls are floor seed solves
      CONSISTENT and one R100-retired spark hash re-derives INCONSISTENT;
      bounded nulls stay bounded, never impossibility; zero unmatched rank-47
      candidates; file-ownership attempts/R134_snap_solve* only; run heavy
      solves under nice -n 19.
    dependsOn:
      - R134-census
  - id: R134-merge
    problem: src/matmul/attempts/R134_merge.ts
    tests: src/matmul/attempts/R134_merge.test.ts
    milestone: M8
    evidence: CAMPAIGN:R134
    timeoutMs: 1800000
    note: "Adjudication merge, run after its R134 siblings land on main: re-verify
      every R134 input with verifyMod2 plus the goalCheckA gate path, snap-check
      any unsnapped rank<=47 support from R134_census.json, drift-check hashes
      against R134_census.json, write R134_merge.json with hashes plus
      consistency outcomes plus mismatch counts plus a zero-drift self-check,
      then append the substantive CAMPAIGN:R134 row (exact-47 scheme or honest
      bounded-red naming the residual); file-ownership attempts/R134_merge.ts
      plus .test.ts plus .json only; no AlphaTensor tensors; field F_2
      throughout."
    dependsOn:
      - R134-census
      - R134-snap
      - R134-ils
