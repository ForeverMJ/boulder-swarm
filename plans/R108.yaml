label: R108
goal: M8 AlphaTensor parity - exact rank<=47 over F_2 for 4x4x4 by closing the
  15 unmatched rank-47 supports named in R107
rationale: R107 census sized but did not close - 74 spark supports retired
  INCONSISTENT in R100, 6 LIVE seed-ils rank-47 supports with vecs never
  exact-solved, 9 UNMATCHED R106 walk-ils rank-47 bests with vecs never matched
  to any exact-solve. Exact-49 floor stands via two-level Strassen plus
  regenerated orbit anchors. The named remainder is exactly these 15 replayable
  rank-47 supports - an exact F_2 coefficient solve on each fixed support either
  ships an exact scheme or retires the hash, closing the space either way.
budget:
  maxRounds: 3
stopConditions:
  - "exact-47 scheme verified by verifyMod2 plus goalSatisfiedA: close as
    WITNESS"
  - "all 15 R107 supports exact-solved with zero survivors and no fresh rank-47
    candidate: close as BOUNDED-NO-WITNESS"
  - "budget exhausted with unsolved supports remaining: report coverage
    honestly, claim nothing closed"
tasks:
  - id: R108-snap
    problem: src/matmul/attempts/R108_snap_solve.ts
    tests: src/matmul/attempts/R108_snap_solve.test.ts
    milestone: M8
    timeoutMs: 1800000
    note: Exact-solve sweeper over the 15 replayable rank-47 supports named in
      R107_census.json on main (6 LIVE seed-ils plus 9 UNMATCHED walk-ils, all
      with vecs, disjoint from the 74 retired spark hashes). Recover gaussSolve
      per-axis machinery without importing AlphaTensor tensors. CONSISTENT ships
      an exact scheme file verified by verifyMod2, INCONSISTENT retires the hash
      with axis and mismatch counts. Checkpoint hash plus axis plus consistency
      plus mismatch counts to R108_snap_solve.ndjson. Controls - floor seed
      solves CONSISTENT, one R100-retired spark hash re-derives INCONSISTENT.
      Bounded nulls stay bounded, never impossibility. File-ownership
      attempts/R108_snap_solve plus ndjson only.
  - id: R108-drain
    problem: src/matmul/attempts/R108_drain49d.ts
    tests: src/matmul/attempts/R108_drain49d.test.ts
    milestone: M8
    timeoutMs: 1800000
    note: Deterministic drain plus meld from fresh exact-49 orbit anchors only,
      regenerated by the R105-R107 product-family construction with a disjoint
      enumeration offset so no R105/R106/R107 support repeats. Fresh seeds
      outside all previously run ILS seeds. At least 50 seeded iters per start
      with greedy exact F_2 drain plus shear flips plus split kicks plus
      deterministic meld. Checkpoint full factor vectors plus stable fnv hashes
      to R108_drain49d.ndjson with resume-skip of hashes already checkpointed in
      R100 plus R101 plus R106 plus R107 ndjson files. Every rank-47 candidate
      exact-solved in-window, verified by verifyMod2 plus goalSatisfiedA.
      File-ownership attempts/R108_drain49d plus ndjson only.
  - id: R108-ils
    problem: src/matmul/attempts/R108_seed_ils4.ts
    tests: src/matmul/attempts/R108_seed_ils4.test.ts
    milestone: M8
    timeoutMs: 1800000
    note: From-zero iterated local search on fresh ground only, seeds exclude every
      previously run ILS seed plus all R107 lane seeds. At least 6 new seeds
      with at least 10s per lane, each lane calibrates against the exact-49
      floor then runs ILS at fixed rank 47. Every rank-47 zero-mismatch
      candidate exact-solved on its fixed support in-window, never left
      unmatched. Checkpoint vecs plus hashes for lane-best 47 and floor-best 49
      states to R108_seed_ils4.ndjson. Verdict BOUNDED-NO-CLOSURE unless an
      exact state is solved and independently re-verified. File-ownership
      attempts/R108_seed_ils4 plus ndjson only.
  - id: R108-merge
    problem: src/matmul/attempts/R108_merge.ts
    tests: src/matmul/attempts/R108_merge.test.ts
    milestone: M8
    evidence: CAMPAIGN:R108
    timeoutMs: 1800000
    note: Adjudication merge run after its R108 siblings land. Re-verify every R108
      input with verifyMod2 plus the goalCheckA gate path, snap-check any
      unsnapped rank-47 support, drift-check hashes against R107_census.json,
      write R108_merge.json with hashes plus consistency outcomes plus mismatch
      counts plus a zero-drift self-check, then append the substantive CAMPAIGN
      R108 row (exact-47 scheme or honest bounded red naming the residual).
      File-ownership attempts/R108_merge plus test plus json only.
