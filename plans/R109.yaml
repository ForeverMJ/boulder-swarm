label: R109
goal: "Close the R107-named remainder on main: exact-solve the 15 replayable
  rank-47 supports and keep draining plus ILS pressure on fresh ground, all over
  F_2"
rationale: "R107-size landed SIZED-NO-CLOSURE with 15 replayable rank-47
  supports carrying vecs (6 LIVE seed-ils plus 9 UNMATCHED walk-ils, disjoint
  from retired spark hashes), and R108-snap plus R108-drain plus R108-ils never
  landed (metrics 0/0, no gate merges), so that exact remainder is still open on
  main. No merge task here: per the timing rule its inputs do not exist yet, so
  adjudication belongs to a later round."
budget:
  maxRounds: 3
stopConditions:
  - "a CONSISTENT exact solve ships a scheme verified by verifyMod2: goalCheckA
    decides"
  - "budget exhausted with no witness: honest BOUNDED red naming the residual,
    never a refutation"
tasks:
  - id: R109-snap
    problem: src/matmul/attempts/R109_snap_solve.ts
    tests: src/matmul/attempts/R109_snap_solve.test.ts
    milestone: M8
    timeoutMs: 1800000
    note: Exact-solve sweeper over the 15 replayable rank-47 supports named in
      R107_census.json on main (6 LIVE seed-ils plus 9 UNMATCHED walk-ils, all
      with vecs, disjoint from retired spark hashes). Recover gaussSolve
      per-axis machinery, solve every support exactly over F_2, CONSISTENT ships
      an exact scheme file verified by verifyMod2, INCONSISTENT retires the hash
      with axis and mismatch counts. Checkpoint hash plus axis plus consistency
      plus mismatch counts to R109_snap_solve.ndjson. Controls are floor seed
      CONSISTENT and one retired spark hash re-derived INCONSISTENT. Bounded
      nulls stay bounded. File-ownership attempts/R109_snap_solve plus ndjson
      only, no AlphaTensor tensors, field F_2 throughout.
  - id: R109-drain
    problem: src/matmul/attempts/R109_drain49e.ts
    tests: src/matmul/attempts/R109_drain49e.test.ts
    milestone: M8
    timeoutMs: 1800000
    note: Deterministic drain plus meld from fresh exact-49 orbit anchors only,
      regenerated by the R105-R107 product-family construction with a disjoint
      enumeration offset so no R105 plus R106 plus R107 support repeats. Fresh
      seeds outside all previously run ILS seeds. At least 50 seeded iters per
      start with greedy exact F_2 drain plus shear flips plus split kicks plus
      deterministic meld. Checkpoint full factor vectors plus stable fnv hashes
      to R109_drain49e.ndjson with resume-skip of hashes already checkpointed in
      R100 plus R101 plus R106 plus R107 ndjson files. Every rank-47 candidate
      exact-solved in-window and verified by verifyMod2 plus goalSatisfiedA.
      File-ownership attempts/R109_drain49e plus ndjson only, run under nice -n
      19.
  - id: R109-ils
    problem: src/matmul/attempts/R109_seed_ils5.ts
    tests: src/matmul/attempts/R109_seed_ils5.test.ts
    milestone: M8
    timeoutMs: 1800000
    note: From-zero iterated local search on fresh ground only, seeds exclude every
      previously run ILS seed plus all R107 lane seeds. At least 6 new seeds
      with at least 10s per lane, each lane calibrates against the exact-49
      floor then runs ILS at fixed rank 47. Every rank-47 zero-mismatch
      candidate exact-solved on its fixed support in-window, never left
      unmatched. Checkpoint vecs plus hashes for lane-best 47 and floor-best 49
      states to R109_seed_ils5.ndjson. Verdict BOUNDED-NO-CLOSURE unless an
      exact state is solved and independently re-verified. File-ownership
      attempts/R109_seed_ils5 plus ndjson only, no AlphaTensor tensors.
