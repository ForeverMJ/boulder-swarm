label: R118
goal: "M8 AlphaTensor parity: retire the leftover rank-47 supports and probe
  fresh ground toward an exact rank<=47 scheme over F_2"
rationale: "R116 censused SIZED-NO-CLOSURE on main and R117 snap-solved its 6
  UNPROCESSED supports 6/6 with 0 CONSISTENT, all merged through the gate. The
  named residual is the 6 LIVE R112_seed_ils7 lane-bests (censused in R113,
  never exact-solved, explicitly out of R117 scope) plus fresh drain/ILS ground
  with disjoint seeds and offsets. No merge task ships in this round: per the
  timing rule its inputs do not exist yet, so adjudication belongs to a later
  round."
budget:
  maxRounds: 2
stopConditions:
  - "witness: goalCheckA exits 0 with an exact rank<=47 scheme over F_2 - close
    and land"
  - "bounded: every lane reports BOUNDED with its residual inventory named -
    never claimed as refutation or impossibility"
  - "hygiene: a colocated-test failure unrelated to the witness is reported and
    halts that lane - judges are never edited into passing"
tasks:
  - id: R118-snap
    problem: src/matmul/attempts/R118_snap_solve2.ts
    tests: src/matmul/attempts/R118_snap_solve2.test.ts
    milestone: M8
    timeoutMs: 1800000
    note: "Exact-solve sweeper over the 6 LIVE R112_seed_ils7 lane-bests censused in
      R113 and never exact-solved, plus any rank-47 support left UNPROCESSED
      after reconciling R116_census.json against R117_snap_solve.ndjson on main;
      skip every RETIRED spark hash and every hash checkpointed in
      R113/R116/R117 ndjson files. Recover the gaussSolve per-axis F_2 machinery
      from landed R117_snap_solve.ts on main without importing AlphaTensor
      tensors. CONSISTENT ships an exact scheme file verified by verifyMod2,
      INCONSISTENT retires the hash with axis and mismatch counts. Checkpoint
      hash plus axis plus consistency plus mismatch counts to
      R118_snap_solve2.ndjson. Controls: floor seed solves CONSISTENT, one
      R100-retired spark hash re-derives INCONSISTENT. Bounded nulls stay
      bounded, zero unmatched rank-47 candidates. File-ownership
      attempts/R118_snap_solve2* plus ndjson only."
  - id: R118-drain
    problem: src/matmul/attempts/R118_drain49j.ts
    tests: src/matmul/attempts/R118_drain49j.test.ts
    milestone: M8
    timeoutMs: 1800000
    note: Deterministic drain plus meld from fresh exact-49 orbit anchors only,
      regenerated by the R105-R107 product-family construction with a disjoint
      enumeration offset so no R105/R106/R107/R108 support repeats. Fresh seeds
      outside all previously run ILS and drain seeds. At least 50 seeded iters
      per start with greedy exact F_2 drain plus shear flips plus split kicks
      plus deterministic meld. Checkpoint full factor vectors plus stable fnv
      hashes to R118_drain49j.ndjson with resume-skip of hashes already
      checkpointed in R100/R101/R106/R107/R108 ndjson files. Every rank-47
      candidate exact-solved in-window, verified by verifyMod2 plus
      goalSatisfiedA. Verdict BOUNDED-RED unless a witness lands. File-ownership
      attempts/R118_drain49j* plus ndjson only.
  - id: R118-ils
    problem: src/matmul/attempts/R118_seed_ils10.ts
    tests: src/matmul/attempts/R118_seed_ils10.test.ts
    milestone: M8
    timeoutMs: 1800000
    note: From-zero iterated local search on fresh ground only, seeds exclude every
      previously run ILS seed plus all R113/R116/R117 lane seeds. At least 6 new
      seeds with at least 10s per lane, each lane calibrates against the
      exact-49 floor then runs ILS at fixed rank 47. Every rank-47 zero-mismatch
      candidate exact-solved on its fixed support in-window, never left
      unmatched. Checkpoint vecs plus hashes for lane-best 47 and floor-best 49
      states to R118_seed_ils10.ndjson. Verdict BOUNDED-NO-CLOSURE unless an
      exact state is solved and independently re-verified. File-ownership
      attempts/R118_seed_ils10* plus ndjson only.
